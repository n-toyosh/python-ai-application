# Streamlit 実行時のハードニング設定。
# ローカル個人利用の既定値。公開デプロイ時の注意は README の「セキュリティ」を参照。

[server]
# ローカルからのみ待ち受ける。社内・公開に出す場合のみ変更し、
# その際は必ず前段に認証（リバースプロキシ / SSO / st.login）を置くこと。
address = "localhost"
port = 8501
# CSRF 保護は有効のまま。無効化しない。
enableXsrfProtection = true
enableCORS = true
# 静的ファイル配信は使わない（アプリのディレクトリを晒さない）。
enableStaticServing = false
# アップロード機能は無いが、将来追加時の既定上限（MB）。
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
# 未捕捉例外のトレースバックを画面に出さない
# （ファイルパス・内部ホスト名・リクエスト情報の露出を防ぐ）。
# ローカルでデバッグしたいときは一時的に "full" にする。
showErrorDetails = "none"
